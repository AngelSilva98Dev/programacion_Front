<form [formGroup]="registroForm" (ngSubmit)="onSubmit()">

    <h2>Formulario de Registro</h2>

    <label>Nombre:</label>
    <input type="text" formControlName="nombre">

    @if (registroForm.get('nombre')?.invalid &&
    registroForm.get('nombre')?.touched) {
    <p>El nombre es obligatorio.</p>
    }

    <label>Email:</label>
    <input type="email" formControlName="email">

    @if (registroForm.get('email')?.invalid &&
    registroForm.get('email')?.touched) {
    <p>El email es obligatorio.</p>
    }

    <fieldset formGroupName="direccion">
        <legend>Dirección</legend>

        <label>Calle:</label>
        <input type="text" formControlName="calle">

        <label>Ciudad:</label>
        <input type="text" formControlName="ciudad">
    </fieldset>

    <button type="submit">Enviar</button>

    <button type="button" (click)="cargarDireccion()">
        Cargar Dirección de Prueba
    </button>

</form>
